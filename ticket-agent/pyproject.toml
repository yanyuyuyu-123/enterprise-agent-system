[project]
name = "ticket-agent"
version = "0.1.0"
description = "企业智能工单 Agent 系统"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.0",
  "redis==5.2.1",
  "celery==5.4.0",
  # kombu 5.5+ 要求 redis-py>=6.1，与项目固定的 redis 5.2.1 不兼容
  "kombu==5.4.2",
  "apscheduler==3.10.4",
  "langgraph==0.2.60",
  "langgraph-checkpoint-postgres==2.0.11",
  "python-multipart==0.0.12",
  "pgvector==0.3.6",
  "numpy==2.4.6",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  # 本地向量模型 bge-m3（EMBEDDING_PROVIDER=local）；Windows 默认安装 CPU 版 torch
  "sentence-transformers==6.2.0",
  "torch==2.15.0",
  # 默认推理后端 EMBEDDING_BACKEND=onnx（int8 量化模型，常驻内存更小）
  "onnxruntime==1.31.1",
  "transformers==5.22.2",
  # V3 本地语音识别（SenseVoice int8 + Silero VAD）；TTS 走本地 CosyVoice2 容器
  "sherpa-onnx==2.0.1",
  "httpx==0.27.2",
  "jinja2==3.1.4",
  "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
dev = [
  "ruff==0.7.4",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 迁移脚本里的多行 SQL 不折行
"migrations/versions/*.py" = ["E501"]
# FastAPI 依赖注入使用默认参数写法
"app/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
